# Node sysctl tuning for the Redpanda pool.
#
# `rpk redpanda tune` covers aio/scheduler/hugepages but NOT inotify limits.
# A 30-shard broker + its config-watcher sidecar exceeds the default
# fs.inotify.max_user_instances (128), crashing with
# "could not create inotify instance: Too many open files".
#
# This privileged DaemonSet raises the inotify + aio limits on every node in
# the redpanda pool (tolerates the redpanda-tuned taint). It sets the values
# once per node then idles.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: redpanda-node-sysctl
  namespace: redpanda
spec:
  selector:
    matchLabels:
      app: redpanda-node-sysctl
  template:
    metadata:
      labels:
        app: redpanda-node-sysctl
    spec:
      nodeSelector:
        node-pool: redpanda
      tolerations:
        - key: redpanda-tuned
          operator: Equal
          value: "true"
          effect: NoSchedule
      hostPID: true
      containers:
        - name: sysctl
          image: busybox:1.36
          securityContext:
            privileged: true
          command:
            - sh
            - -c
            - |
              set -e
              sysctl -w fs.inotify.max_user_instances=8192
              sysctl -w fs.inotify.max_user_watches=1048576
              sysctl -w fs.aio-max-nr=1048576
              echo "sysctls applied on $(hostname)"
              sleep infinity
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
