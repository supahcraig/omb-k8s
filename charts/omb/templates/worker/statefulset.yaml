{{- /*
Worker count is scaled at runtime from the UI. Keep the live replica count on
`helm upgrade`; worker.replicas only sets the size of a fresh install.
*/ -}}
{{- $replicas := .Values.worker.replicas -}}
{{- $existing := lookup "apps/v1" "StatefulSet" .Release.Namespace "omb-worker" -}}
{{- if and $existing $existing.spec (hasKey $existing.spec "replicas") -}}
{{- $replicas = $existing.spec.replicas -}}
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: omb-worker
  labels:
    app: omb-worker
spec:
  serviceName: omb-worker
  replicas: {{ $replicas }}
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: omb-worker
  template:
    metadata:
      labels:
        app: omb-worker
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        node-pool: worker
      tolerations:
        - key: dedicated
          operator: Equal
          value: benchmark
          effect: NoSchedule
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: omb-worker
              topologyKey: kubernetes.io/hostname
      containers:
        - name: worker
          image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag }}"
          imagePullPolicy: Always
          env:
            - name: OMB_MODE
              value: worker
            - name: OMB_WORKER_PORT
              value: {{ .Values.worker.port | quote }}
          ports:
            - containerPort: {{ .Values.worker.port }}
              name: worker
          resources:
            requests:
              cpu: {{ .Values.worker.resources.cpu | quote }}
              memory: {{ .Values.worker.resources.memory | quote }}
            limits:
              memory: {{ .Values.worker.resources.memory | quote }}
