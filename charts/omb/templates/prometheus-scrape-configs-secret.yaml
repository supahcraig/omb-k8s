{{- /*
The control plane writes the Redpanda scrape job into this secret at runtime
(Settings save and pod startup). Carry the live value through upgrades — a
blank template would wipe the scrape config on every `helm upgrade`.
*/ -}}
{{- $name := "omb-prometheus-additional-scrape-configs" -}}
{{- $key := "additional-scrape-configs.yaml" -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $value := "" -}}
{{- if and $existing $existing.data -}}
{{- $value = index $existing.data $key | default "" -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  {{ $key }}: {{ $value | quote }}
